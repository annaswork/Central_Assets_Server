<!-- flash.html: Flash messages notifications -->
{% if flash_message %}
  <div class="banner banner-{{ flash_type or 'info' }}" style="margin-bottom:1.5rem; display:flex; justify-content:space-between; align-items:center;">
    <span>{{ flash_message }}</span>
    <button type="button" onclick="this.parentElement.remove()" style="background:none; border:none; color:inherit; cursor:pointer; font-size:1.1rem; padding:0 0.5rem;">✕</button>
  </div>
{% endif %}
