<!-- Central Library Reorder Modal -->
<div id="centralReorderModal" class="modal-overlay" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); align-items:center; justify-content:center; padding:1rem;" onclick="handleReorderModalBackdrop(event)">
  <div class="modal-container reorder-modal-container" style="background:var(--md-sys-color-surface, #1e293b); color:var(--md-sys-color-on-surface, #f8fafc); border:1px solid var(--md-sys-color-outline-variant, #334155); border-radius:14px; max-width:680px; width:100%; max-height:90vh; box-shadow:var(--md-sys-elevation-3, 0 10px 30px rgba(0,0,0,0.6)); overflow:hidden; display:flex; flex-direction:column; animation:modalPopIn 0.2s ease-out;" onclick="event.stopPropagation()">

    <!-- Modal Header -->
    <div style="display:flex; justify-content:space-between; align-items:center; padding:1.1rem 1.4rem; border-bottom:1px solid var(--md-sys-color-outline-variant, #334155); background:var(--md-sys-color-surface-container-high, #1e293b);">
      <div style="display:flex; align-items:center; gap:0.65rem;">
        <div style="width:34px; height:34px; border-radius:8px; background:rgba(96,165,250,0.12); display:flex; align-items:center; justify-content:center; color:var(--md-sys-color-primary, #60a5fa); flex-shrink:0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </div>
        <div>
          <h3 style="margin:0; font-size:1.15rem; font-weight:700; color:var(--md-sys-color-on-surface, #f8fafc);" id="reorderModalTitle">Reorder Items</h3>
          <p style="margin:0.15rem 0 0 0; font-size:0.8rem; color:var(--md-sys-color-on-surface-variant, #94a3b8);" id="reorderModalSubtitle">Drag and drop items or type sequence numbers to adjust placement order.</p>
        </div>
      </div>
      <button type="button" onclick="closeCentralReorderModal()" style="background:transparent; border:none; color:var(--md-sys-color-on-surface-variant, #94a3b8); cursor:pointer; font-size:1.25rem; line-height:1; padding:0.35rem; border-radius:6px; transition:color 0.15s;" title="Close">✕</button>
    </div>

    <!-- Filter Bar (Contextual for subcategory and asset) -->
    <div id="reorderFiltersContainer" style="padding:0.85rem 1.4rem; background:rgba(0,0,0,0.15); border-bottom:1px solid var(--md-sys-color-outline-variant, #334155); display:flex; flex-wrap:wrap; gap:0.75rem; align-items:center;">
      
      <!-- Category Filter (Subcategory & Asset) -->
      <div id="reorderCatFilterWrap" style="display:none; flex:1; min-width:180px;">
        <label style="display:block; font-size:0.75rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--md-sys-color-on-surface-variant, #94a3b8); margin-bottom:0.25rem;">Category</label>
        <select id="reorderCategorySelect" class="select" style="width:100%; height:34px; padding:0.25rem 0.6rem; font-size:0.85rem;" onchange="handleReorderCategoryChange()">
          <!-- Populated dynamically -->
        </select>
      </div>

      <!-- Subcategory Filter (Asset only) -->
      <div id="reorderSubFilterWrap" style="display:none; flex:1; min-width:180px;">
        <label style="display:block; font-size:0.75rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--md-sys-color-on-surface-variant, #94a3b8); margin-bottom:0.25rem;">Subcategory</label>
        <select id="reorderSubcategorySelect" class="select" style="width:100%; height:34px; padding:0.25rem 0.6rem; font-size:0.85rem;" onchange="handleReorderSubcategoryChange()">
          <!-- Populated dynamically -->
        </select>
      </div>

      <!-- Quick Search / Filter Items Input -->
      <div style="flex:1; min-width:160px;">
        <label style="display:block; font-size:0.75rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--md-sys-color-on-surface-variant, #94a3b8); margin-bottom:0.25rem;">Quick Filter</label>
        <input type="text" id="reorderSearchInput" class="input" placeholder="Filter by name..." style="width:100%; height:34px; padding:0.25rem 0.6rem; font-size:0.85rem;" oninput="filterReorderCardsList(this.value)">
      </div>
    </div>

    <!-- Modal Body: Items List -->
    <div style="flex:1; overflow-y:auto; padding:1.2rem 1.4rem; position:relative; min-height:220px; max-height:55vh;">
      
      <!-- Loading Indicator -->
      <div id="reorderLoadingSpinner" style="display:none; position:absolute; inset:0; background:rgba(30,41,59,0.7); backdrop-filter:blur(2px); z-index:10; align-items:center; justify-content:center; flex-direction:column; gap:0.75rem;">
        <div class="spinner" style="width:32px; height:32px; border:3px solid rgba(96,165,250,0.2); border-top-color:var(--md-sys-color-primary, #60a5fa); border-radius:50%; animation:spin 0.8s linear infinite;"></div>
        <span style="font-size:0.85rem; color:var(--md-sys-color-on-surface-variant, #94a3b8);">Loading items...</span>
      </div>

      <!-- Empty State -->
      <div id="reorderEmptyNotice" style="display:none; text-align:center; padding:3rem 1rem; color:var(--md-sys-color-on-surface-variant, #94a3b8);">
        <div style="font-size:2.2rem; margin-bottom:0.5rem; opacity:0.6;">📦</div>
        <p style="margin:0; font-weight:600; font-size:0.95rem;">No items found</p>
        <p style="margin:0.25rem 0 0 0; font-size:0.82rem;">Select a different category or subcategory filter above.</p>
      </div>

      <!-- Draggable Items Container -->
      <div id="reorderItemsList" style="display:flex; flex-direction:column; gap:0.55rem;">
        <!-- Dynamically rendered reorder cards -->
      </div>
    </div>

    <!-- Modal Footer -->
    <div style="display:flex; justify-content:space-between; align-items:center; padding:0.9rem 1.4rem; border-top:1px solid var(--md-sys-color-outline-variant, #334155); background:var(--md-sys-color-surface-container-high, #1e293b); flex-wrap:wrap; gap:0.75rem;">
      <div style="display:flex; align-items:center; gap:0.65rem;">
        <span id="reorderItemsCountBadge" style="font-size:0.82rem; color:var(--md-sys-color-on-surface-variant, #94a3b8); font-weight:500;">0 items</span>
        <span id="reorderUnsavedIndicator" style="display:none; background:rgba(245,158,11,0.15); color:#f59e0b; border:1px solid rgba(245,158,11,0.3); font-size:0.72rem; padding:2px 8px; border-radius:12px; font-weight:600;">
          Unsaved Changes
        </span>
      </div>

      <div style="display:flex; gap:0.5rem; align-items:center;">
        <button type="button" id="reorderResetBtn" class="btn btn-outlined" onclick="resetReorderItemsOrder()" style="display:none;" title="Revert to initial order">
          Reset
        </button>
        <button type="button" class="btn btn-outlined" onclick="closeCentralReorderModal()">
          Cancel
        </button>
        <button type="button" id="reorderSaveBtn" class="btn btn-primary" onclick="saveCentralReorderOrder()" style="min-width:110px;">
          Save Order
        </button>
      </div>
    </div>

  </div>
</div>

<script src="/admin-assets/js/reorder_modal.js"></script>
